<svg xmlns="http://www.w3.org/2000/svg" width="180" height="126" viewBox="0 0 180 126" role="img" aria-labelledby="title desc"><title id="title">Ellipse method example</title><desc id="desc">A small correlation matrix with ellipses whose tilt and color show correlation values.</desc><rect width="180" height="126" rx="6" fill="#fff"/><g stroke="#d7dce2" stroke-width="1"><path d="M38 20H158 M38 52H158 M38 84H158 M38 116H158 M38 20V116 M78 20V116 M118 20V116 M158 20V116" fill="none"/></g><g><ellipse cx="58" cy="36" rx="14" ry="5" transform="rotate(-35 58 36)" fill="#2166ac"/><ellipse cx="98" cy="36" rx="12" ry="7" transform="rotate(35 98 36)" fill="#b2182b"/><ellipse cx="138" cy="36" rx="5" ry="4" fill="#b2182b"/><ellipse cx="58" cy="68" rx="12" ry="7" transform="rotate(35 58 68)" fill="#b2182b"/><ellipse cx="98" cy="68" rx="14" ry="5" transform="rotate(-35 98 68)" fill="#2166ac"/><ellipse cx="138" cy="68" rx="13" ry="6" transform="rotate(-20 138 68)" fill="#2166ac"/><ellipse cx="58" cy="100" rx="5" ry="4" fill="#b2182b"/><ellipse cx="98" cy="100" rx="13" ry="6" transform="rotate(-20 98 100)" fill="#2166ac"/><ellipse cx="138" cy="100" rx="14" ry="5" transform="rotate(-35 138 100)" fill="#2166ac"/></g></svg>