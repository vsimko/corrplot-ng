# The committed lockfile is authoritative; CI validates it with --locked.
[workspace]
resolver = "2"
members = [
    "crates/corrplot-core",
    "tools/corrplot-cli",
    "bindings/node",
    "bindings/wasm",
]
# The disposable R/rextendr prototype retains its own audited lockfile so
# CRAN/offline vendoring remains isolated from Node/WASM workspace dependencies.
exclude = ["bindings/r/rextendr-prototype"]

# Preserve the former CLI's release settings for all workspace consumers.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
