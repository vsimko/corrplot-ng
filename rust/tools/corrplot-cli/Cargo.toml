[package]
name = "corrplot-ng"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Standalone native command-line renderer for corrplot-ng"
license = "MIT"

[[bin]]
name = "corrplot-ng"
path = "src/main.rs"

[dependencies]
corrplot-core = { path = "../../crates/corrplot-core" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
