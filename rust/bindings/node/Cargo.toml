[package]
name = "corrplot-ng-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
corrplot-core = { path = "../../crates/corrplot-core" }
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.3"
