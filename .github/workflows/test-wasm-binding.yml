name: Test browser WebAssembly binding

on:
  pull_request:
    paths:
      - "bindings/wasm/**"
      - "crates/corrplot-core/**"
      - ".github/workflows/test-wasm-binding.yml"
  push:
    branches: [main]
    paths:
      - "bindings/wasm/**"
      - "crates/corrplot-core/**"
      - ".github/workflows/test-wasm-binding.yml"

permissions:
  contents: read

jobs:
  test:
    name: WASM Node smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Run WebAssembly binding tests in Node
        working-directory: bindings/wasm
        run: wasm-pack test --node
      - name: Build browser ESM package
        working-directory: bindings/wasm
        run: wasm-pack build --target web --release --out-dir pkg
      - name: Install Playwright
        if: matrix.node == 26
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        if: matrix.node == 26
        run: npx playwright install --with-deps chromium
      - name: Run browser WebAssembly smoke test
        if: matrix.node == 26
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/corrplot-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/bindings/wasm/examples/browser/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          node bindings/wasm/examples/browser/smoke.test.mjs
