name: Test browser WebAssembly binding

on:
  pull_request:
    paths:
      - "npm/packages/wasm/**"
      - "rust/bindings/wasm/**"
      - "npm/packages/typescript/**"
      - "npm/packages/react/**"
      - "npm/packages/vue/**"
      - "npm/package.json"
      - "npm/package-lock.json"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - ".github/workflows/test-wasm-binding.yml"
  push:
    branches: [main]
    paths:
      - "npm/packages/wasm/**"
      - "rust/bindings/wasm/**"
      - "npm/packages/typescript/**"
      - "npm/packages/react/**"
      - "npm/packages/vue/**"
      - "npm/package.json"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - ".github/workflows/test-wasm-binding.yml"
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: test-wasm-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WASM Node smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[24,26]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-workspace-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('npm/package.json', 'npm/**/package.json') }}
          restore-keys: |
            npm-workspace-${{ runner.os }}-node-${{ matrix.node }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: wasm-binding
      - name: Cache wasm-pack executable
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Run WebAssembly binding tests in Node
        working-directory: npm/packages/wasm
        run: wasm-pack test --node ../../../rust/bindings/wasm
      - name: Build browser ESM package
        working-directory: npm/packages/wasm
        run: npm run build
      - name: Measure WASM size, initialization, and renderer baselines
        if: matrix.node == 26 && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          CORRPLOT_BENCHMARK_OUTPUT: ${{ runner.temp }}/wasm-baseline.json
        run: node npm/packages/wasm/benchmarks/measure.mjs
      - name: Upload WASM baseline artifact
        if: matrix.node == 26 && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v7
        with:
          name: wasm-baseline-node-${{ matrix.node }}-${{ github.run_id }}
          path: ${{ runner.temp }}/wasm-baseline.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify browser WASM npm package contents
        working-directory: npm/packages/wasm
        run: npm run test:pack
      - name: Install npm workspace dependencies for the TypeScript facade smoke
        working-directory: npm
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Install matching Linux esbuild and Rollup binaries omitted with optional dependencies
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          root_esbuild_version="$(node -p "require('./node_modules/esbuild/package.json').version")"
          rollup_version="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --no-package-lock --ignore-scripts --omit=optional \
            "@esbuild/linux-x64@${root_esbuild_version}" \
            "@rollup/rollup-linux-x64-gnu@${rollup_version}"

          # Vite can install its own esbuild version when it is incompatible
          # with the workspace's direct esbuild dependency. Install the matching
          # optional binary beside that nested host instead of reusing the
          # workspace binary (which may have a different version).
          vite_esbuild_package="node_modules/vite/node_modules/esbuild/package.json"
          if [[ -f "$vite_esbuild_package" ]]; then
            vite_esbuild_version="$(node -p "require('./${vite_esbuild_package}').version")"
            npm install --prefix node_modules/vite --no-save --no-package-lock \
              --ignore-scripts --omit=optional "@esbuild/linux-x64@${vite_esbuild_version}"
          fi

          node <<'NODE'
          const fs = require("node:fs");

          function assertMatchingBinary(hostPath, binaryPath, label) {
            if (!fs.existsSync(hostPath)) {
              throw new Error(`${label}: esbuild host package is missing at ${hostPath}`);
            }
            if (!fs.existsSync(binaryPath)) {
              throw new Error(`${label}: matching Linux binary is missing at ${binaryPath}`);
            }
            const hostVersion = require(hostPath).version;
            const binaryVersion = require(binaryPath).version;
            if (hostVersion !== binaryVersion) {
              throw new Error(
                `${label}: esbuild host ${hostVersion} does not match Linux binary ${binaryVersion}`,
              );
            }
            console.log(`${label}: esbuild host and Linux binary both use ${hostVersion}`);
          }

          assertMatchingBinary(
            "./node_modules/esbuild/package.json",
            "./node_modules/@esbuild/linux-x64/package.json",
            "workspace",
          );

          const viteHost = "./node_modules/vite/node_modules/esbuild/package.json";
          if (fs.existsSync(viteHost)) {
            assertMatchingBinary(
              viteHost,
              "./node_modules/vite/node_modules/@esbuild/linux-x64/package.json",
              "Vite nested",
            );
          }

          assertMatchingBinary(
            "./node_modules/rollup/package.json",
            "./node_modules/@rollup/rollup-linux-x64-gnu/package.json",
            "Rollup",
          );
          NODE
      - name: Bundle the browser TypeScript facade against the built WASM package
        working-directory: npm
        run: npm run build:browser-smoke --workspace=@corrplot-ng/typescript
      - name: Build React Vite and esbuild browser bundles
        working-directory: npm
        run: npm run build:browser-smoke --workspace=@corrplot-ng/react
      - name: Build Vue Vite and esbuild browser bundles
        working-directory: npm
        run: npm run build:browser-smoke --workspace=@corrplot-ng/vue
      - name: Start React development server for Strict Mode smoke
        working-directory: npm
        run: |
          nohup npm run dev:browser-smoke --workspace=@corrplot-ng/react -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/react-vite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/react-vite.log"
          exit 1
      - name: Start Vue development server for browser smoke
        working-directory: npm
        run: |
          nohup npm run dev:browser-smoke --workspace=@corrplot-ng/vue -- --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/vue-vite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vue-vite.log"
          exit 1
      - name: Install Playwright
        if: matrix.node == 24
        working-directory: npm
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Firefox and WebKit
        if: matrix.node == 24
        working-directory: npm
        run: npx playwright install --with-deps firefox webkit
      - name: Verify preinstalled Chrome
        if: matrix.node == 24
        run: google-chrome --version
      - name: Run browser WebAssembly smoke tests in Chromium, Firefox, and WebKit
        if: matrix.node == 24
        env:
          DEBUG: pw:api
          CORRPLOT_BROWSER_BENCHMARK_OUTPUT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && format('{0}/browser-canvas-benchmark.jsonl', runner.temp) || '' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/corrplot-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/npm/packages/wasm/examples/browser/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          for browser in chromium firefox webkit; do
            echo "Running browser smoke test: $browser"
            CORRPLOT_BROWSER="$browser" node npm/packages/wasm/examples/browser/smoke.test.mjs
            CORRPLOT_BROWSER="$browser" node npm/packages/typescript/test/browser/smoke.test.mjs
            CORRPLOT_BROWSER="$browser" node npm/packages/react/test/browser/smoke.test.mjs
            CORRPLOT_BROWSER="$browser" node npm/packages/vue/test/browser/smoke.test.mjs
          done
      - name: Upload browser Canvas performance artifact
        if: matrix.node == 24 && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v7
        with:
          name: browser-canvas-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-canvas-benchmark.jsonl
          if-no-files-found: error
          retention-days: 90
