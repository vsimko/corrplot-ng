name: Rust Windows binary install

on:
  pull_request:
    paths:
      - "rust/bindings/r/rextendr-prototype/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - ".github/workflows/test-rust-windows-binary.yml"
      - "docs/cran-rust-dependency-audit-results.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-rust-windows-binary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-binary:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/bindings/r/rextendr-prototype/.ci-rust-target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/bindings/r/rextendr-prototype -> .ci-rust-target
          shared-key: rextendr-ci
      - name: Fetch Rust workspace dependencies after cache restore
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rextendr
            any::usethis
      - name: Generate temporary R package
        run: Rscript rust/bindings/r/rextendr-prototype/prepare-r-package.R
      - name: Build Windows binary package
        shell: bash
        run: |
          mkdir -p dist
          cd dist
          R CMD INSTALL --build ../rust/bindings/r/rextendr-prototype/.ci-r-package
          test -n "$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-windows-binary
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  install-without-toolchain:
    needs: build-windows-binary
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v8
        with:
          name: rust-windows-binary
          path: dist
      - name: Install binary with a restricted PATH and run smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows binary package ZIP was not downloaded." }
          $rBin = Split-Path (Get-Command R.exe).Source
          $env:PATH = "$rBin;C:\Windows\System32;C:\Windows"
          $lib = Join-Path $env:TEMP "corrplotng-rust-library"
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          & (Join-Path $rBin "R.exe") CMD INSTALL "--library=$lib" $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw "Binary installation failed with exit code $LASTEXITCODE." }
          $env:R_LIBS_USER = $lib

          # Keep R code out of a nested PowerShell -e string. This avoids
          # PowerShell parsing R's escaped quotes before Rscript can see them.
          $smokeScript = Join-Path $env:TEMP "rust-binary-smoke.R"
          $smokeCode = @'
          library(corrplotngrustspike)
          x <- build_scene_json_rust(
            c("a", "b"),
            matrix(c(1, 0.2, 0.2, 1), 2),
            "binary smoke"
          )
          stopifnot(
            is.character(x),
            length(x) == 1L,
            grepl('"schema_version":1', x, fixed = TRUE)
          )
          '@
          [System.IO.File]::WriteAllText(
            $smokeScript,
            $smokeCode,
            [System.Text.UTF8Encoding]::new($false)
          )
          & (Join-Path $rBin "Rscript.exe") $smokeScript
          if ($LASTEXITCODE -ne 0) { throw "Installed Rust binary smoke test failed with exit code $LASTEXITCODE." }
