name: Rust Windows binary install

on:
  pull_request:
    paths:
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/test-rust-windows-binary.yml"
  push:
    branches:
      - prototype/rust-rextendr-spike
      - test/windows-binary-install-rust

jobs:
  build-windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rextendr
            any::devtools
            any::usethis
      - name: Generate temporary R package
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Build Windows binary package
        shell: bash
        run: |
          mkdir -p dist
          cd dist
          R CMD INSTALL --build ../prototypes/rust-rextendr/.ci-r-package
          ls -la
          test -n "$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-windows-binary
          path: dist/*.zip
          if-no-files-found: error

  install-without-toolchain:
    needs: build-windows-binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v4
        with:
          name: rust-windows-binary
          path: dist
      - name: Install binary with a restricted PATH and run smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows binary package ZIP was not downloaded." }
          $rBin = Split-Path (Get-Command R.exe).Source
          $env:PATH = "$rBin;C:\Windows\System32;C:\Windows"
          $lib = Join-Path $env:TEMP "corrplotng-rust-library"
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          & (Join-Path $rBin "R.exe") CMD INSTALL "--library=$lib" $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw "Binary installation failed with exit code $LASTEXITCODE." }
          $env:R_LIBS_USER = $lib
          & (Join-Path $rBin "Rscript.exe") -e "library(corrplotngrustspike); source('prototypes/rust-rextendr/test-r-integration.R')"
          if ($LASTEXITCODE -ne 0) { throw "Installed binary smoke test failed with exit code $LASTEXITCODE." }
