name: Build Node prebuilt packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-node-prebuilt-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.package }} prebuilt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: linux-x64-gnu
            os: ubuntu-latest
          - package: darwin-x64
            os: macos-15-intel
          - package: darwin-arm64
            os: macos-15
          - package: win32-x64-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust -> target
          shared-key: node-addon
      - name: Build native Node-API addon
        working-directory: npm/packages/native-node
        run: npm run build
      - name: Package platform-specific npm binary
        working-directory: npm/packages/native-node
        env:
          CORRPLOT_NODE_PLATFORM_PACKAGE: ${{ matrix.package }}
          CORRPLOT_NODE_PACKAGE_OUTPUT: ${{ runner.temp }}/node-prebuilt
        run: npm run package:prebuilt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: corrplot-node-${{ matrix.package }}
          path: ${{ runner.temp }}/node-prebuilt/*.tgz
          if-no-files-found: error
          retention-days: 30
