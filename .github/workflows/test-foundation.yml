name: Test foundation

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            foundation:
              - 'r/corrplotng/**'
              - 'contracts/**'
              - 'fixtures/**'
              - 'npm/packages/typescript/**'
              - 'npm/packages/wasm/package.json'
              - 'tools/repository/validate_svg.py'
              - 'tools/repository/dev-check.sh'
              - 'python/reference/requirements-dev.txt'
              - '.github/dependabot.yml'
              - 'python/reference/**'
              - 'schemas/**'
              - 'rust/**'
              - '**/*.schema.json'
              - '.gitignore'
              - 'docs/root-directory-policy.md'
              - 'tools/repository/**'
              - '.github/workflows/test-foundation.yml'

  fixture-integrity:
    name: Validate shared test fixtures
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/reference/requirements-dev.txt
      - name: Install Python test dependencies
        run: python -m pip install -r python/reference/requirements-dev.txt
      - name: Check repository root policy
        run: python tools/repository/check_root_policy.py
      - name: Test repository root policy checker
        run: python -m unittest discover -s tools/repository/tests -p 'test_*.py' -v
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Validate local development command syntax
        run: bash -n tools/repository/dev-check.sh
      - name: Run quick foundation checks through the local entry point
        run: bash tools/repository/dev-check.sh quick
      - name: Test TypeScript facade core
        run: node --test npm/packages/typescript/test/factory.test.js npm/packages/typescript/test/package-isolation.test.js npm/packages/typescript/test/node-cjs.test.cjs
      - name: Test benchmark run comparison
        run: python -m unittest discover -s tools/repository/benchmarks -p 'test_compare_runs.py' -v

  svg-interoperability:
    name: Rasterize a self-contained SVG with librsvg
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Render and validate SVG
        run: |
          python python/reference/renderer.py python/reference/example.json > "$RUNNER_TEMP/figure.svg"
          python tools/repository/validate_svg.py "$RUNNER_TEMP/figure.svg"
      - name: Rasterize SVG
        run: |
          rsvg-convert --format png --output "$RUNNER_TEMP/figure.png" "$RUNNER_TEMP/figure.svg"
          test -s "$RUNNER_TEMP/figure.png"
          file "$RUNNER_TEMP/figure.png"

  legacy-r-oracle:
    name: Check semantic output against legacy corrplot
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out corrplot-ng
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
      - name: Download pinned legacy corrplot source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/taiyun/corrplot/archive/62532f700e6c9d04b93ffbf0bf56e264b0e0368e.tar.gz \
            --output /tmp/corrplot-legacy.tar.gz
      - name: Install pinned legacy corrplot
        run: R CMD INSTALL /tmp/corrplot-legacy.tar.gz
      - name: Install JSON bridge dependency
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          packages: any::jsonlite
      - name: Verify R scene contract consumer
        run: Rscript python/reference/test_r_scene_consumer.R
      - name: Verify legacy semantic oracle and export scene input
        run: Rscript python/reference/test_legacy_corrplot_oracle.R
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify legacy-to-scene bridge
        run: python python/reference/test_legacy_scene_bridge.py /tmp/corrplot-legacy-scene-input.json
