name: Test foundation

on:
  pull_request:
  push:
    branches:
      - main
      - benchmarks/stress-dispatch-20261030
  workflow_dispatch:
    inputs:
      include_stress:
        description: 'Run the 500x500 and 1000x1000 stress workloads'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            foundation:
              - 'tests/**'
              - 'benchmarks/**'
              - 'prototypes/shared-svg/**'
              - 'schemas/**'
              - '**/*.schema.json'
              - '.github/workflows/test-foundation.yml'

  fixture-integrity:
    name: Validate shared test fixtures
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON fixtures
        run: python -m json.tool tests/fixtures/correlation-cases.json > /dev/null

      - name: Run fixture integrity tests
        run: python -m unittest discover -s tests -v

      - name: Install scene schema validator
        run: python -m pip install jsonschema

      - name: Run shared SVG prototype tests
        run: python -m unittest discover -s prototypes/shared-svg -p 'test_*.py' -v

  legacy-r-oracle:
    name: Check semantic output against legacy corrplot
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrplot-ng
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Download pinned legacy corrplot source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/taiyun/corrplot/archive/62532f700e6c9d04b93ffbf0bf56e264b0e0368e.tar.gz \
            --output /tmp/corrplot-legacy.tar.gz

      - name: Install pinned legacy corrplot
        run: R CMD INSTALL /tmp/corrplot-legacy.tar.gz

      - name: Install JSON bridge dependency
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'

      - name: Verify legacy semantic oracle and export scene input
        run: Rscript prototypes/shared-svg/test_legacy_corrplot_oracle.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify legacy-to-scene bridge
        run: python prototypes/shared-svg/test_legacy_scene_bridge.py /tmp/corrplot-legacy-scene-input.json


  shared-core-benchmarks:
    name: Run initial shared-core benchmarks
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run benchmark correctness tests
        run: python -m unittest discover -s tests -p 'test_benchmark_suite.py' -v

      - name: Run benchmark suite
        run: python benchmarks/run_shared_core.py --iterations 20 --output benchmark-results/results.json

      - name: Upload machine-readable benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-benchmark-results
          path: benchmark-results/results.json
          if-no-files-found: error
          retention-days: 90

  shared-core-stress-benchmarks:
    name: Run large-matrix stress benchmarks
    if: (github.event_name == 'workflow_dispatch' && inputs.include_stress) || github.ref == 'refs/heads/benchmarks/stress-dispatch-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run B03 and B04 stress benchmarks
        run: python benchmarks/run_shared_core.py --iterations 20 --include-stress --output benchmark-results/stress-results.json

      - name: Upload stress benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-stress-benchmark-results
          path: benchmark-results/stress-results.json
          if-no-files-found: error
          retention-days: 90
