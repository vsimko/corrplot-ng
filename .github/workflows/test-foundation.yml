name: Test foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            foundation:
              - 'tests/**'
              - 'scripts/validate_svg.py'
              - 'prototypes/shared-svg/**'
              - 'prototypes/normalized-matrix-v1/**'
              - 'prototypes/publication-config-v1/**'
              - 'prototypes/publication-svg-v1/**'
              - 'schemas/**'
              - '**/*.schema.json'
              - '.github/workflows/test-foundation.yml'

  fixture-integrity:
    name: Validate shared test fixtures
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON fixtures
        run: python -m json.tool tests/fixtures/correlation-cases.json > /dev/null
      - name: Run fixture integrity tests
        run: python -m unittest discover -s tests -v
      - name: Install scene schema validator
        run: python -m pip install jsonschema
      - name: Validate normalized matrix v1 contract and fixtures
        run: python -m unittest discover -s prototypes/normalized-matrix-v1 -p 'test_*.py' -v
      - name: Run shared SVG prototype tests
        run: python -m unittest discover -s prototypes/shared-svg -p 'test_*.py' -v
      - name: Validate generated Python SVG artifact
        run: |
          python prototypes/shared-svg/renderer.py prototypes/shared-svg/example.json > "$RUNNER_TEMP/shared-svg.svg"
          python scripts/validate_svg.py "$RUNNER_TEMP/shared-svg.svg"
      - name: Run publication configuration tests
        run: python -m unittest discover -s prototypes/publication-config-v1 -p 'test_*.py' -v
      - name: Run publication SVG export tests
        run: python -m unittest discover -s prototypes/publication-svg-v1 -p 'test_*.py' -v

  svg-interoperability:
    name: Rasterize a self-contained SVG with librsvg
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render and validate SVG
        run: |
          python prototypes/shared-svg/renderer.py prototypes/shared-svg/example.json > "$RUNNER_TEMP/figure.svg"
          python scripts/validate_svg.py "$RUNNER_TEMP/figure.svg"
      - name: Rasterize SVG
        run: |
          rsvg-convert --format png --output "$RUNNER_TEMP/figure.png" "$RUNNER_TEMP/figure.svg"
          test -s "$RUNNER_TEMP/figure.png"
          file "$RUNNER_TEMP/figure.png"

  legacy-r-oracle:
    name: Check semantic output against legacy corrplot
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrplot-ng
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Download pinned legacy corrplot source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/taiyun/corrplot/archive/62532f700e6c9d04b93ffbf0bf56e264b0e0368e.tar.gz \
            --output /tmp/corrplot-legacy.tar.gz
      - name: Install pinned legacy corrplot
        run: R CMD INSTALL /tmp/corrplot-legacy.tar.gz
      - name: Install JSON bridge dependency
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - name: Verify R scene-v1 consumer
        run: Rscript prototypes/shared-svg/test_r_scene_consumer.R
      - name: Verify legacy semantic oracle and export scene input
        run: Rscript prototypes/shared-svg/test_legacy_corrplot_oracle.R
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify legacy-to-scene bridge
        run: python prototypes/shared-svg/test_legacy_scene_bridge.py /tmp/corrplot-legacy-scene-input.json
