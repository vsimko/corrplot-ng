name: Verify shared Rust core reuse

on:
  push:
    branches: [main]
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "rust/tools/corrplot-cli/**"
      - "rust/bindings/r/rextendr-prototype/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - ".github/workflows/test-shared-rust-core.yml"
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "rust/tools/corrplot-cli/**"
      - "rust/bindings/r/rextendr-prototype/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - ".github/workflows/test-shared-rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-shared-rust-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wasm32-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Generate and fetch the Rust workspace lockfile
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fetch --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: rust-workspace-lockfile
          path: rust/Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: shared-core-stable
      - name: Compile shared core and its tests for WebAssembly
        run: cargo check --locked --offline --all-targets --target wasm32-unknown-unknown --manifest-path rust/crates/corrplot-core/Cargo.toml
      - name: Build shared core for WebAssembly
        run: cargo build --locked --offline --lib --target wasm32-unknown-unknown --manifest-path rust/crates/corrplot-core/Cargo.toml
      - name: Run shared semantic tests on native target
        run: cargo test --locked --offline --manifest-path rust/crates/corrplot-core/Cargo.toml

  minimum-supported-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: wasm32-unknown-unknown
      - name: Generate and fetch the Rust workspace lockfile
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fetch --manifest-path rust/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: shared-core-msrv
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Test shared core at the declared MSRV
        run: cargo test --locked --offline --manifest-path rust/crates/corrplot-core/Cargo.toml
      - name: Check shared core for WebAssembly at the declared MSRV
        run: cargo check --locked --offline --all-targets --target wasm32-unknown-unknown --manifest-path rust/crates/corrplot-core/Cargo.toml
      - name: Test CLI consumer at the declared MSRV
        run: cargo test --locked --offline --manifest-path rust/tools/corrplot-cli/Cargo.toml
      - name: Compile rextendr consumer at the declared MSRV
        run: cargo check --locked --manifest-path rust/bindings/r/rextendr-prototype/Cargo.toml
      - name: Verify the consumer resolves the repository-local shared core
        shell: bash
        run: |
          tree="$(cargo tree --manifest-path rust/bindings/r/rextendr-prototype/Cargo.toml -i corrplot-core)"
          echo "$tree"
          echo "$tree" | grep -F "corrplot-core v0.1.0"
          if ! echo "$tree" | grep -Fq 'rust/crates/corrplot-core' && ! echo "$tree" | grep -Fq 'rust\\crates\\corrplot-core'; then
            echo "R/rextendr consumer did not resolve the repository-local core crate" >&2
            exit 1
          fi
