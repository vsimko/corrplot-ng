name: Verify shared Rust core reuse

on:
  push:
    branches: [main]
    paths:
      - "crates/corrplot-core/**"
      - "tools/corrplot-ng/**"
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/test-shared-rust-core.yml"
  pull_request:
    paths:
      - "crates/corrplot-core/**"
      - "tools/corrplot-ng/**"
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/test-shared-rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-shared-rust-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rextendr-consumer:
    name: Compile shared-core R/rextendr consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Compile R/rextendr consumer
        run: cargo check --locked --manifest-path prototypes/rust-rextendr/Cargo.toml
      - name: Verify the consumer resolves the repository-local shared core
        shell: bash
        run: |
          tree="$(cargo tree --manifest-path prototypes/rust-rextendr/Cargo.toml -i corrplot-core)"
          echo "$tree"
          echo "$tree" | grep -F "corrplot-core v0.1.0"
          if ! echo "$tree" | grep -Fq 'crates/corrplot-core' && ! echo "$tree" | grep -Fq 'crates\\corrplot-core'; then
            echo "R/rextendr consumer did not resolve the repository-local core crate" >&2
            exit 1
          fi

  wasm32-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/corrplot-core -> target
            tools/corrplot-ng -> target
            prototypes/rust-rextendr -> target
          shared-key: shared-core-stable
      - name: Compile shared core and its tests for WebAssembly
        run: cargo check --locked --offline --all-targets --target wasm32-unknown-unknown --manifest-path crates/corrplot-core/Cargo.toml
      - name: Build shared core for WebAssembly
        run: cargo build --locked --offline --lib --target wasm32-unknown-unknown --manifest-path crates/corrplot-core/Cargo.toml
      - name: Run shared semantic tests on native target
        run: cargo test --locked --offline --manifest-path crates/corrplot-core/Cargo.toml

  minimum-supported-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/corrplot-core -> target
            tools/corrplot-ng -> target
            prototypes/rust-rextendr -> target
          shared-key: shared-core-msrv
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Test shared core at the declared MSRV
        run: cargo test --locked --offline --manifest-path crates/corrplot-core/Cargo.toml
      - name: Check shared core for WebAssembly at the declared MSRV
        run: cargo check --locked --offline --all-targets --target wasm32-unknown-unknown --manifest-path crates/corrplot-core/Cargo.toml
      - name: Test CLI consumer at the declared MSRV
        run: cargo test --locked --offline --manifest-path tools/corrplot-ng/Cargo.toml
      - name: Compile rextendr consumer at the declared MSRV
        run: cargo check --locked --manifest-path prototypes/rust-rextendr/Cargo.toml
