name: Rust spike

on:
  push:
    paths:
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/test-rust-spike.yml"
  pull_request:
    paths:
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/test-rust-spike.yml"

jobs:
  cargo-check:
    name: Cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: prototypes/rust-rextendr
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/rust-rextendr
      - run: cargo check

  r-to-rust:
    name: R-to-Rust integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R integration-test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rextendr
            any::devtools
            any::usethis
      - name: Generate temporary R package with rextendr
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Install generated R package
        shell: bash
        run: R CMD INSTALL prototypes/rust-rextendr/.ci-r-package
      - name: Test Rust function from R
        run: Rscript -e "library(corrplotngrustspike); source('prototypes/rust-rextendr/test-r-integration.R')"
