name: Test native Node binding

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "npm/packages/native-node/**"
      - "npm/packages/native-node-*/**"
      - "rust/bindings/node/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - ".github/workflows/test-node-native.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-node-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-15-intel","macos-15","windows-latest"]') }}
        node: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22,24,26]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust -> target
          shared-key: node-addon
      - name: Build native addon and run Node tests
        working-directory: npm/packages/native-node
        run: npm test
      - name: Package platform-specific binary
        working-directory: npm/packages/native-node
        env:
          CORRPLOT_NODE_PLATFORM_PACKAGE: ${{ matrix.os == 'ubuntu-latest' && 'linux-x64-gnu' || matrix.os == 'macos-15-intel' && 'darwin-x64' || matrix.os == 'macos-15' && 'darwin-arm64' || 'win32-x64-msvc' }}
          CORRPLOT_NODE_PACKAGE_OUTPUT: ${{ runner.temp }}/node-prebuilt
        run: npm run package:prebuilt
      - name: Install prebuilt tarballs in a clean consumer project
        working-directory: npm/packages/native-node
        env:
          CORRPLOT_NODE_PACKAGE_OUTPUT: ${{ runner.temp }}/node-prebuilt
        run: npm run test:prebuilt
