name: Test Node and browser-WASM backend parity

on:
  pull_request:
    paths:
      - "bindings/node/**"
      - "bindings/cross-backend/**"
      - "tests/fixtures/**"
      - "bindings/wasm/**"
      - "rust/bindings/wasm/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - "prototypes/shared-svg/scene-v1.example.json"
      - "prototypes/shared-svg/scene-v1-construction.example.json"
      - ".github/workflows/test-node-wasm-parity.yml"
  push:
    branches: [main]
    paths:
      - "bindings/node/**"
      - "bindings/cross-backend/**"
      - "tests/fixtures/**"
      - "bindings/wasm/**"
      - "rust/bindings/wasm/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "!rust/crates/corrplot-core/src/scene_tests.rs"
      - "prototypes/shared-svg/scene-v1.example.json"
      - "prototypes/shared-svg/scene-v1-construction.example.json"
      - ".github/workflows/test-node-wasm-parity.yml"
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 4'

permissions:
  contents: read

concurrency:
  group: test-node-wasm-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Node ${{ matrix.node }} backend parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: node-wasm-parity
      - name: Cache wasm-pack executable
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build native Node-API backend
        working-directory: bindings/node
        run: npm run build
      - name: Build Node-compatible WASM backend
        working-directory: bindings/wasm
        run: wasm-pack build --target nodejs --release --out-dir ../../../bindings/wasm/pkg-node ../../rust/bindings/wasm
      - name: Compare Node and WASM semantics, SVG, and RGBA output
        run: node --test bindings/cross-backend/test-node-wasm-parity.cjs
      - name: Smoke-test the Node/WASM benchmark harness without timing thresholds
        if: github.event_name == 'pull_request'
        run: node bindings/cross-backend/benchmark-node-wasm.mjs --smoke
      - name: Measure native Node and Node-hosted WASM baselines
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CORRPLOT_BENCHMARK_OUTPUT: ${{ runner.temp }}/node-wasm-benchmark.json
        run: node bindings/cross-backend/benchmark-node-wasm.mjs
      - name: Upload native/WASM benchmark artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: node-wasm-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/node-wasm-benchmark.json
          if-no-files-found: error
          retention-days: 90
