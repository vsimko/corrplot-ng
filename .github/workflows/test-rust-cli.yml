name: Test native Rust CLI

on:
  pull_request:
    paths:
      - "tools/corrplot-ng/**"
      - "prototypes/shared-svg/**"
      - "prototypes/rust-rextendr/**"
      - "crates/corrplot-core/**"
      - "prototypes/publication-config-v1/**"
      - "scripts/validate_svg.py"
      - ".github/workflows/test-rust-cli.yml"
  push:
    branches: [main]
    paths:
      - "tools/corrplot-ng/**"
      - "crates/corrplot-core/**"
      - "prototypes/rust-rextendr/**"
      - "prototypes/shared-svg/**"
      - "prototypes/publication-config-v1/**"
      - "scripts/validate_svg.py"
      - ".github/workflows/test-rust-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify CLI depends only on the local shared core
        shell: bash
        run: |
          tree="$(cargo tree --manifest-path tools/corrplot-ng/Cargo.toml --edges normal)"
          echo "$tree"
          echo "$tree" | grep -F "corrplot-core v0.1.0"
          if echo "$tree" | grep -Eq "registry\\+|git\\+"; then
            echo "The native CLI must not acquire external runtime dependencies" >&2
            exit 1
          fi
      - name: Test shared matrix core
        run: cargo test --locked --offline --manifest-path crates/corrplot-core/Cargo.toml
      - name: Test
        run: cargo test --locked --offline --manifest-path tools/corrplot-ng/Cargo.toml
      - name: Build release executable
        run: cargo build --locked --offline --release --manifest-path tools/corrplot-ng/Cargo.toml
      - name: Validate native CLI SVG artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          tools/corrplot-ng/target/release/corrplot-ng render --config prototypes/publication-config-v1/examples/basic.json --output "$RUNNER_TEMP/native-cli.svg"
          python scripts/validate_svg.py "$RUNNER_TEMP/native-cli.svg"
