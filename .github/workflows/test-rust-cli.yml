name: Test native Rust CLI

on:
  pull_request:
    paths:
      - "tools/corrplot-ng/**"
      - ".github/workflows/test-rust-cli.yml"
  push:
    branches: [main]
    paths:
      - "tools/corrplot-ng/**"
      - ".github/workflows/test-rust-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify dependency-free manifest
        shell: bash
        run: |
          test "$(cargo tree --manifest-path tools/corrplot-ng/Cargo.toml --edges normal | wc -l)" -eq 1
      - name: Test
        run: cargo test --locked --manifest-path tools/corrplot-ng/Cargo.toml
      - name: Build release executable
        run: cargo build --locked --release --manifest-path tools/corrplot-ng/Cargo.toml
