name: Test native Rust CLI

on:
  pull_request:
    paths:
      - "rust/tools/corrplot-cli/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "prototypes/publication-config-v1/**"
      - "scripts/validate_svg.py"
      - "docs/cli-installation.md"
      - "tests/fixtures/**"
      - "tests/README.md"
      - ".github/workflows/test-rust-cli.yml"
  push:
    branches: [main]
    paths:
      - "docs/cli-installation.md"
      - "rust/tools/corrplot-cli/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "prototypes/publication-config-v1/**"
      - "scripts/validate_svg.py"
      - "tests/fixtures/**"
      - "tests/README.md"
      - ".github/workflows/test-rust-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-rust-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: shared-core-stable
      - name: Fetch Rust workspace dependencies after cache restore
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Verify CLI depends only on the local shared core
        shell: bash
        run: |
          tree="$(cargo tree --manifest-path rust/tools/corrplot-cli/Cargo.toml --edges normal)"
          echo "$tree"
          echo "$tree" | grep -F "corrplot-core v0.1.0"
          if echo "$tree" | grep -Eq "registry\\+|git\\+"; then
            echo "The native CLI must not acquire external runtime dependencies" >&2
            exit 1
          fi
      - name: Test shared matrix core
        run: cargo test --locked --offline --manifest-path rust/crates/corrplot-core/Cargo.toml
      - name: Test
        run: cargo test --locked --offline --manifest-path rust/tools/corrplot-cli/Cargo.toml
      - name: Build release executable
        run: cargo build --locked --offline --release --manifest-path rust/tools/corrplot-cli/Cargo.toml
      - name: Set up Python for shared fixture parity
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify native CLI against shared matrix fixtures
        run: python rust/tools/corrplot-cli/tests/verify_shared_fixtures.py --binary "rust/target/release/corrplot-ng${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Validate native CLI SVG artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          rust/target/release/corrplot-ng render --config prototypes/publication-config-v1/examples/basic.json --output "$RUNNER_TEMP/native-cli.svg"
          python scripts/validate_svg.py "$RUNNER_TEMP/native-cli.svg"

      - name: Verify installed CLI outside the checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/corrplot-install"
          mkdir -p "$prefix/bin" "$prefix/work"
          install -m 0755 rust/target/release/corrplot-ng "$prefix/bin/corrplot-ng"
          cd "$prefix/work"
          printf ',alpha,beta\nalpha,1,0.5\nbeta,0.5,1\n' > matrix.csv
          "$prefix/bin/corrplot-ng" version
          "$prefix/bin/corrplot-ng" presets
          "$prefix/bin/corrplot-ng" capabilities > capabilities.json
          "$prefix/bin/corrplot-ng" render --input matrix.csv --output correlation.svg
          test -s correlation.svg
          grep -q '<svg' correlation.svg
          test -s capabilities.json
      - name: Verify installed CLI outside the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "corrplot-install"
          $bin = Join-Path $prefix "bin"
          $work = Join-Path $prefix "work"
          New-Item -ItemType Directory -Force $bin, $work | Out-Null
          Copy-Item rust/target/release/corrplot-ng.exe (Join-Path $bin "corrplot-ng.exe")
          @"
          ,alpha,beta
          alpha,1,0.5
          beta,0.5,1
          "@ | Set-Content -Encoding utf8NoBOM (Join-Path $work "matrix.csv")
          Push-Location $work
          & (Join-Path $bin "corrplot-ng.exe") version
          & (Join-Path $bin "corrplot-ng.exe") presets
          & (Join-Path $bin "corrplot-ng.exe") capabilities | Set-Content -Encoding utf8NoBOM capabilities.json
          & (Join-Path $bin "corrplot-ng.exe") render --input matrix.csv --output correlation.svg
          if (!(Test-Path correlation.svg)) { throw "Installed CLI did not create correlation.svg" }
          if (!(Select-String -Path correlation.svg -Pattern '<svg' -Quiet)) { throw "Installed CLI output is not SVG" }
          if (!(Test-Path capabilities.json)) { throw "Installed CLI did not emit capabilities" }
          Pop-Location
