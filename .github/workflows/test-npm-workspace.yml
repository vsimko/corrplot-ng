name: Test npm workspace

on:
  pull_request:
    paths:
      - "package.json"
      - "packages/**"
      - "bindings/node/**"
      - "bindings/wasm/**"
      - ".changeset/**"
      - ".github/workflows/test-npm-workspace.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "packages/**"
      - "bindings/node/**"
      - "bindings/wasm/**"
      - ".changeset/**"
      - ".github/workflows/test-npm-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-npm-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace validation (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install workspace dependencies without lifecycle scripts
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund --package-lock=false
      - name: Validate workspace package graph
        run: npm ls --workspaces --depth=0
      - name: Test native Node binding
        run: npm run test:node
      - name: Test TypeScript facade
        run: npm run test:typescript
      - name: Test React integration
        run: npm run test:react
      - name: Test and build browser WASM binding
        working-directory: bindings/wasm
        run: |
          wasm-pack test --node
          npm run build
      - name: Verify package contents
        run: npm run pack:dry-run
