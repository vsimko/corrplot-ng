name: Test npm workspace

on:
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "package.json"
      - "packages/**"
      - "bindings/node/**"
      - "bindings/wasm/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - ".changeset/**"
      - ".github/workflows/test-npm-workspace.yml"
  push:
    branches: [main]
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "package.json"
      - "packages/**"
      - "bindings/node/**"
      - "bindings/wasm/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - ".changeset/**"
      - ".github/workflows/test-npm-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-npm-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace validation (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-workspace-${{ runner.os }}-node-24-${{ hashFiles('package.json', '**/package.json') }}
          restore-keys: |
            npm-workspace-${{ runner.os }}-node-24-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: npm-workspace
      - name: Cache wasm-pack executable
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Generate workspace lockfile with npm 11
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated workspace lockfile
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-lock-generated
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Install workspace dependencies from generated lockfile
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Validate workspace package graph
        run: npm ls --workspaces --depth=0
      - name: Test native Node binding
        run: npm run test:node
      - name: Test TypeScript facade
        run: npm run test:typescript
      - name: Test React integration
        run: npm run test:react
      - name: Test Vue integration
        run: npm run test:vue
      - name: Test and build browser WASM binding
        working-directory: bindings/wasm
        run: |
          wasm-pack test --node ../../rust/bindings/wasm
          npm run build
      - name: Verify package contents
        run: npm run pack:dry-run
