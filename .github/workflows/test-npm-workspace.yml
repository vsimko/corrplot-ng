name: Test npm workspace

on:
  pull_request:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "npm/package.json"
      - "npm/package-lock.json"
      - "npm/packages/native-node-*/**"
      - "npm/tests/cross-backend/**"
      - "npm/.changeset/**"
      - "npm/packages/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - ".github/workflows/test-npm-workspace.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "tests/fixtures/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/crates/corrplot-core/**"
      - "npm/package.json"
      - "npm/package-lock.json"
      - "npm/packages/**"
      - "npm/packages/native-node-*/**"
      - "npm/tests/cross-backend/**"
      - "rust/bindings/node/**"
      - "rust/bindings/wasm/**"
      - "npm/.changeset/**"
      - ".github/workflows/test-npm-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-npm-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace validation (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-workspace-${{ runner.os }}-node-24-${{ hashFiles('npm/package.json', 'npm/package-lock.json', 'npm/**/package.json') }}
          restore-keys: |
            npm-workspace-${{ runner.os }}-node-24-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
          shared-key: npm-workspace
      - name: Cache wasm-pack executable
        id: wasm-pack-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install workspace dependencies from committed lockfile
        working-directory: npm
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate workspace package graph
        working-directory: npm
        run: npm ls --workspaces --depth=0
      - name: Test native Node binding
        working-directory: npm
        run: npm run test:node
      - name: Test TypeScript facade
        working-directory: npm
        run: npm run test:typescript
      - name: Test React integration
        working-directory: npm
        run: npm run test:react
      - name: Test Vue integration
        working-directory: npm
        run: npm run test:vue
      - name: Test and build browser WASM binding
        working-directory: npm/packages/wasm
        run: |
          wasm-pack test --node ../../../rust/bindings/wasm
          npm run build
      - name: Verify package contents
        working-directory: npm
        run: npm run pack:dry-run
      - name: Install packed npm packages in an isolated consumer
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/corrplot-npm-consumer"
          tarballs="$staging/tarballs"
          consumer="$staging/project"
          mkdir -p "$tarballs" "$consumer"
          printf '{"private":true}\n' > "$consumer/package.json"

          export CORRPLOT_NODE_PLATFORM_PACKAGE=linux-x64-gnu
          export CORRPLOT_NODE_PACKAGE_OUTPUT="$tarballs"
          npm run package:prebuilt --workspace=@corrplot-ng/native-node
          npm run pack:tarball --workspace=@corrplot-ng/native-node -- --pack-destination "$tarballs"
          npm pack --workspace=@corrplot-ng/wasm --pack-destination "$tarballs"
          npm pack --workspace=@corrplot-ng/typescript --pack-destination "$tarballs"
          npm pack --workspace=@corrplot-ng/react --pack-destination "$tarballs"
          npm pack --workspace=@corrplot-ng/vue --pack-destination "$tarballs"

          npm install --prefix "$consumer" --no-save --omit=optional --no-audit --no-fund \
            "$tarballs"/*.tgz react@19 vue@3

          cd "$consumer"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);
          const native = require("@corrplot-ng/native-node");
          assert.equal(native.validateMatrix({
            labels: ["alpha", "beta"],
            rows: 2,
            columns: 2,
            values: [1, 0.5, 0.5, 1],
            kind: "correlation",
          }), true);

          const facadeCjs = require("@corrplot-ng/typescript");
          assert.equal(typeof facadeCjs.createCorrplotEngine, "function");

          const [facade, wasm, react, vue] = await Promise.all([
            import("@corrplot-ng/typescript"),
            import("@corrplot-ng/wasm"),
            import("@corrplot-ng/react"),
            import("@corrplot-ng/vue"),
          ]);
          assert.equal(typeof facade.createCorrplotEngine, "function");
          assert.equal(typeof wasm.default, "function");
          assert.equal(typeof react.Corrplot, "function");
          assert.ok(vue.Corrplot);
          console.log("Isolated consumer installation and package entry-point smoke tests passed.");
          NODE
  native-toolchains:
    name: Native toolchains (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-native-toolchains-${{ runner.os }}-node-24-${{ hashFiles('npm/package.json', 'npm/package-lock.json') }}
          restore-keys: |
            npm-native-toolchains-${{ runner.os }}-node-24-
      - name: Install workspace dependencies and platform-native optional packages
        working-directory: npm
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test TypeScript 7 native compiler
        working-directory: npm
        run: npm run test:types --workspace=@corrplot-ng/typescript
      - name: Build a minimal Vite 8 / Rolldown bundle
        working-directory: npm
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.join(process.env.RUNNER_TEMP, "corrplot-vite-rolldown-smoke");
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(path.join(root, "index.html"), '<script type="module" src="/src.js"></script>\n');
          fs.writeFileSync(path.join(root, "src.js"), 'export const smoke = "ok";\n');
          NODE
          npm exec --workspace=@corrplot-ng/react -- vite build "$RUNNER_TEMP/corrplot-vite-rolldown-smoke" --outDir "$RUNNER_TEMP/corrplot-vite-rolldown-smoke-dist"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const output = path.join(process.env.RUNNER_TEMP, "corrplot-vite-rolldown-smoke-dist", "assets");
          if (!fs.readdirSync(output).some((name) => name.endsWith(".js"))) {
            throw new Error("Vite 8 / Rolldown smoke build did not emit a JavaScript asset");
          }
          console.log("Vite 8 / Rolldown native platform build succeeded");
          NODE
