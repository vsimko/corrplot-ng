name: Rust rextendr offline package install

on:
  push:
    branches:
      - experiment/rust-rextendr-offline-package
    paths:
      - ".github/workflows/rust-rextendr-offline-package.yml"
      - "prototypes/rust-rextendr/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/rust-rextendr-offline-package.yml"

permissions:
  contents: read

jobs:
  offline-package-install:
    name: Offline generated R package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/prototypes/rust-rextendr/.ci-rust-target
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install R integration-test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rextendr
            any::devtools
            any::usethis
      - name: Generate temporary R package with rextendr
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Resolve, audit, and vendor dependencies of the generated package
        shell: bash
        run: |
          set -euxo pipefail
          cd prototypes/rust-rextendr/.ci-r-package/src/rust
          cp ../../../deny.toml deny.toml
          cargo generate-lockfile
          cargo deny check licenses
          cargo vendor --locked vendor > vendor-config.toml
          mkdir -p .cargo
          {
            cat vendor-config.toml
            printf '\\n[net]\\noffline = true\\n'
          } > .cargo/config.toml
          cargo build --locked --offline --release
      - name: Install generated R package without network access
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euxo pipefail
          R CMD INSTALL --preclean prototypes/rust-rextendr/.ci-r-package
      - name: Test Rust function from R
        run: Rscript -e "library(corrplotngrustspike); source('prototypes/rust-rextendr/test-r-integration.R')"
