name: Rust rextendr offline package install

on:
  push:
    branches:
      - experiment/rust-rextendr-offline-package
      - experiment/rust-binary-size-matrix
    paths:
      - ".github/workflows/rust-rextendr-offline-package.yml"
      - "prototypes/rust-rextendr/**"
      - "crates/corrplot-core/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "prototypes/rust-rextendr/**"
      - "crates/corrplot-core/**"
      - ".github/workflows/rust-rextendr-offline-package.yml"

permissions:
  contents: read

concurrency:
  group: rust-rextendr-offline-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-package-install:
    name: Offline generated R package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/prototypes/rust-rextendr/.ci-rust-target
      CARGO_BUILD_JOBS: 2
      # Exercise the experimental post-link debug stripping flags on Linux/macOS.
      # The generator deliberately skips Windows until PE/COFF behavior is validated.
      CORRPLOT_REXTENDR_STRIP_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install R integration-test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rextendr
            any::devtools
            any::usethis
            any::testthat
      - name: Generate temporary R package with rextendr
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Verify third-party license notice is included
        shell: bash
        run: |
          set -euxo pipefail
          license_dir=prototypes/rust-rextendr/.ci-r-package/inst/licenses
          test -s "$license_dir/extendr-MIT.txt"
          grep -q "Copyright (c) 2021 The Extendr contributors" "$license_dir/extendr-MIT.txt"
          grep -q "extendr-api-v0.9.0" "$license_dir/README.md"
      - name: Resolve, audit, and vendor dependencies of the generated package
        shell: bash
        run: |
          set -euxo pipefail
          cd prototypes/rust-rextendr/.ci-r-package/src/rust
          cp ../../../deny.toml deny.toml
          cargo metadata --format-version 1 > /dev/null
          echo "Normal dependency tree for the R integration:"
          cargo tree --locked --edges normal | tee cargo-dependency-tree.txt
          if grep -q '^corrplot-ng v' cargo-dependency-tree.txt; then
            echo "The R integration must not depend on the standalone CLI package" >&2
            exit 1
          fi
          cargo deny check licenses
          cargo vendor --locked vendor > vendor-config.toml
          mkdir -p .cargo
          {
            cat vendor-config.toml
            printf '\n[net]\noffline = true\n'
          } > .cargo/config.toml
          cargo build --lib --locked --offline --release
          # rextendr sets CARGO_HOME to src/.cargo during R CMD INSTALL.
          # Its config file is therefore src/.cargo/config.toml, not
          # src/rust/.cargo/config.toml. Cargo config paths are relative to
          # the parent of the .cargo directory, so rust/vendor is correct.
          sed 's/directory = "vendor"/directory = "rust\/vendor"/' vendor-config.toml > install-vendor-config.toml
          mv install-vendor-config.toml vendor-config.toml
          mkdir -p ../.cargo
          cp vendor-config.toml ../.cargo/config.toml
          # R CMD build runs the generated clean target, which removes the
          # expanded vendor directory. Preserve it as an archive whose paths
          # restore rust/vendor when rextendr extracts it from src/.
          # Omit repository-only .github content to avoid hidden-file notes
          # in R CMD check. Keep Cargo's checksum metadata consistent with
          # the pruned vendor tree so offline Cargo builds remain verifiable.
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          "$PYTHON" - <<'PY'
          import json
          import os

          for root, dirs, files in os.walk("vendor"):
              if ".cargo-checksum.json" not in files:
                  continue
              checksum_path = os.path.join(root, ".cargo-checksum.json")
              with open(checksum_path, encoding="utf-8") as stream:
                  checksum = json.load(stream)
              entries = checksum.get("files", {})
              pruned_dirs = (".github/", "tests/", "examples/", "benches/")
              checksum["files"] = {
                  path: digest
                  for path, digest in entries.items()
                  if not path.startswith(pruned_dirs)
                  and path != ".cargo_vcs_info.json"
              }
              with open(checksum_path, "w", encoding="utf-8") as stream:
                  json.dump(checksum, stream, separators=(",", ":"))
                  stream.write(chr(10))

          import shutil
          for root, dirs, _ in os.walk("vendor"):
              for name in (".github", "tests", "examples", "benches"):
                  if name in dirs:
                      dirs.remove(name)
                      shutil.rmtree(os.path.join(root, name))
              vcs_info = os.path.join(root, ".cargo_vcs_info.json")
              if os.path.exists(vcs_info):
                  os.remove(vcs_info)
          PY
          tar -cJf vendor.tar.xz -C .. rust/vendor
          rm -rf .cargo
      - name: Install generated R package without network access
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euxo pipefail
          R CMD INSTALL prototypes/rust-rextendr/.ci-r-package
      - name: Test Rust function from R
        run: Rscript -e "library(corrplotngrustspike); source('prototypes/rust-rextendr/test-r-integration.R')"
      - name: Build the current native extendr cdylib for a same-run comparison
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euxo pipefail
          manifest=experiments/wasm-r/native-r/Cargo.toml
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export RUSTFLAGS="-C link-arg=-Wl,--strip-debug"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export RUSTFLAGS="-C link-arg=-Wl,-S"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            R_HOME="$(R RHOME)" cargo build --manifest-path "$manifest" --target x86_64-pc-windows-gnu --release
            native_dir="prototypes/rust-rextendr/.ci-rust-target/x86_64-pc-windows-gnu/release"
          else
            R_HOME="$(R RHOME)" cargo build --manifest-path "$manifest" --release
            native_dir="prototypes/rust-rextendr/.ci-rust-target/release"
          fi
          native_library="$(find "$native_dir" -maxdepth 1 -type f | grep -E '(lib)?corrplot_r_native\.(so|dylib|dll)$' | head -n 1 || true)"
          if [[ -z "$native_library" ]]; then
            echo "Native extendr cdylib not found in $native_dir" >&2
            find "$native_dir" -maxdepth 1 -type f -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/size-results"
          native_snapshot="$GITHUB_WORKSPACE/size-results/$(basename "$native_library")"
          cp "$native_library" "$native_snapshot"
          echo "NATIVE_R_LIBRARY=$native_snapshot" >> "$GITHUB_ENV"
          echo "Native R cdylib snapshot: $native_snapshot ($(wc -c < "$native_snapshot" | tr -d ' ') bytes)"
          cargo tree --manifest-path "$manifest" --edges normal > native-r-cargo-tree.txt
          cp experiments/wasm-r/native-r/Cargo.lock native-r-Cargo.lock
      - name: Report optimized installed package and native library sizes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          package_dir = Path(subprocess.check_output(
              ["Rscript", "-e", "cat(normalizePath(find.package('corrplotngrustspike')))"],
              text=True,
          ).strip())
          target_dir = Path("prototypes/rust-rextendr/.ci-rust-target/release")

          def report(label, paths):
              paths = [path for path in paths if path.is_file()]
              total = sum(path.stat().st_size for path in paths)
              print(f"{label}: {total:,} bytes ({total / 1024 / 1024:.2f} MiB)")
              for path in sorted(paths, key=lambda item: item.stat().st_size, reverse=True):
                  print(f"  {path.name}: {path.stat().st_size:,} bytes")

          report("Installed package", list(package_dir.rglob("*")))
          report("Installed native libraries", list((package_dir / "libs").rglob("*")))
          report("Rust static library build artifacts", list(target_dir.glob("*corrplotngrustspike*")))
          print(f"Installed package path: {package_dir}")
          PY
      - name: Inspect retained native-library sections and symbols
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: python3 prototypes/rust-rextendr/inspect-native-library.py
      - name: Experimentally strip debug data from a temporary installed library
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: python3 prototypes/rust-rextendr/experiment-strip-debug.py
      - name: Build and inspect the actual R source tarball
        shell: bash
        run: |
          set -euxo pipefail
          R CMD build --no-build-vignettes --no-manual prototypes/rust-rextendr/.ci-r-package
          tarball=corrplotngrustspike_0.1.0.tar.gz
          test -s "$tarball"
          # R CMD build runs rextendr's clean target, which removes the expanded
          # vendor tree. Restore it into the source archive so R CMD check can
          # compile the package offline from the actual tarball.
          unpack_dir="$(mktemp -d)"
          tar -xzf "$tarball" -C "$unpack_dir"
          tar -xJf "$unpack_dir/corrplotngrustspike/src/rust/vendor.tar.xz" -C "$unpack_dir/corrplotngrustspike/src"
          rm "$tarball"
          tar -czf "$tarball" -C "$unpack_dir" corrplotngrustspike
          tar -tzf "$tarball" > source-tarball-files.txt
          echo "R source tarball size: $(wc -c < "$tarball") bytes"
          grep -qx 'corrplotngrustspike/inst/licenses/extendr-MIT.txt' source-tarball-files.txt
          grep -qx 'corrplotngrustspike/inst/licenses/README.md' source-tarball-files.txt
          grep -qx 'corrplotngrustspike/src/rust/Cargo.lock' source-tarball-files.txt
          grep -qx 'corrplotngrustspike/src/rust/vendor.tar.xz' source-tarball-files.txt
          # Cargo vendor uses the package name as the directory; verify the
          # extendr-api manifest exists in the expanded source archive.
          test -s "$unpack_dir/corrplotngrustspike/src/rust/vendor/extendr-api/Cargo.toml"
          echo "R source tarball contains extendr license notices, Cargo.lock, and expanded vendored Rust sources."
      - name: Check the built R source package
        shell: bash
        env:
          # Keep the CRAN-style checks deterministic in CI; remote incoming
          # checks depend on CRAN availability and are tested separately.
          _R_CHECK_CRAN_INCOMING_: "false"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
        run: |
          set -euxo pipefail
          R CMD check --as-cran --no-manual corrplotngrustspike_0.1.0.tar.gz
      - name: Produce machine-readable size and build manifest
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p size-results
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess

          def command(args):
              result = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, check=False)
              return result.stdout.strip()

          package = Path(command([
              "Rscript", "-e",
              "cat(normalizePath(find.package('corrplotngrustspike')))"
          ]))
          native_r = Path(os.environ["NATIVE_R_LIBRARY"])
          source_tarball = Path("corrplotngrustspike_0.1.0.tar.gz")
          installed_files = [p for p in package.rglob("*") if p.is_file()]
          installed_native = [
              p for p in (package / "libs").rglob("*")
              if p.is_file() and p.suffix.lower() in {".so", ".dylib", ".dll"}
          ]

          def describe(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              size = path.stat().st_size
              return {"path": str(path), "bytes": size,
                      "mib": round(size / 1024 / 1024, 4),
                      "sha256": digest.hexdigest()}

          import re

          lock_text = Path("native-r-Cargo.lock").read_text(encoding="utf-8")
          extendr_match = re.search(
              r'(?ms)^\[\[package\]\]\nname = "extendr-api"\nversion = "([^"]+)"',
              lock_text,
          )
          if not extendr_match:
              raise RuntimeError("Could not resolve extendr-api version from native Cargo.lock")
          runner_os = os.environ.get("RUNNER_OS")
          legacy_strip_requested = os.environ.get("CORRPLOT_REXTENDR_STRIP_DEBUG", "").lower() == "true"
          legacy_strip_flag = {
              "Linux": "-Wl,--strip-debug",
              "macOS": "-Wl,-S",
          }.get(runner_os)
          legacy_strip_effective = legacy_strip_requested and legacy_strip_flag is not None
          current_native_linker_flag = {
              "Linux": "-C link-arg=-Wl,--strip-debug",
              "macOS": "-C link-arg=-Wl,-S",
          }.get(runner_os)

          report = {
              "platform": platform.platform(),
              "machine": platform.machine(),
              "runner_os": os.environ.get("RUNNER_OS"),
              "target_triple": (
                  "x86_64-pc-windows-gnu" if os.environ.get("RUNNER_OS") == "Windows"
                  else "x86_64-apple-darwin" if os.environ.get("RUNNER_OS") == "macOS"
                  else "x86_64-unknown-linux-gnu"
              ),
              "rustc_vv": command(["rustc", "-Vv"]),
              "cargo_version": command(["cargo", "-V"]),
              "r_version": command(["R", "--version"]).splitlines()[0],
              "r_cc": command(["R", "CMD", "config", "CC"]),
              "r_shlib_ldflags": command(["R", "CMD", "config", "SHLIB_LDFLAGS"]),
              "release_profile": True,
              "legacy_build_time_debug_stripping": {
                  "requested": legacy_strip_requested,
                  "effective": legacy_strip_effective,
                  "linker_flag": legacy_strip_flag
              },
              "legacy_extendr_version": "0.9.0",
              "current_native_extendr_api_resolved_version": extendr_match.group(1),
              "current_native_cdylib_linker_flag": current_native_linker_flag,
              "artifacts": {
                  "legacy_installed_r_package": {
                      "bytes": sum(p.stat().st_size for p in installed_files),
                      "mib": round(sum(p.stat().st_size for p in installed_files) / 1024 / 1024, 4),
                      "files": len(installed_files)
                  },
                  "legacy_installed_native_libraries": [describe(p) for p in installed_native],
                  "current_native_extendr_cdylib": describe(native_r),
                  "legacy_r_source_tarball": describe(source_tarball)
              }
          }
          Path("size-results/size-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          Path("size-results/rustc-vv.txt").write_text(report["rustc_vv"] + "\n", encoding="utf-8")
          Path("size-results/native-r-cargo-tree.txt").write_text(
              Path("native-r-cargo-tree.txt").read_text(encoding="utf-8"), encoding="utf-8"
          )
          Path("size-results/native-r-Cargo.lock").write_bytes(Path("native-r-Cargo.lock").read_bytes())
          print(json.dumps(report, indent=2))
          PY
          {
            echo "### Cross-platform Rust/R footprint"
            echo
            python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("size-results/size-report.json").read_text(encoding="utf-8"))
          print("| Artifact | Exact size |")
          print("|---|---:|")
          for label, value in [
              ("Legacy installed R package", r["artifacts"]["legacy_installed_r_package"]["bytes"]),
              ("Legacy installed native library", sum(x["bytes"] for x in r["artifacts"]["legacy_installed_native_libraries"])),
              ("Current native extendr cdylib", r["artifacts"]["current_native_extendr_cdylib"]["bytes"]),
              ("Legacy R source tarball", r["artifacts"]["legacy_r_source_tarball"]["bytes"]),
          ]:
              print(f"| {label} | {value:,} bytes |")
          print()
          print(f"Platform: {r['platform']}; target: {r['target_triple']}")
          print(f"Rust: {r['rustc_vv'].splitlines()[0]}; {r['cargo_version']}; {r['r_version']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reproducible size measurements
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rust-r-footprint-${{ matrix.os }}
          path: size-results/
          if-no-files-found: error

