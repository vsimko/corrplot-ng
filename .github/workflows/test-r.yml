name: R package checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-r-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      r_package: ${{ steps.filter.outputs.r_package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            r_package:
              - 'r/corrplotng/**'
              - 'python/reference/**'
              - 'fixtures/**'
              - 'schemas/**'
              - '**/*.schema.json'
              - '.github/workflows/test-r.yml'

  r-cmd-check:
    name: R CMD check
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.r_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/corrplotng
          needs: check
      - name: Check pinned legacy corrplot reference
        shell: Rscript {0}
        run: |
          if (as.character(utils::packageVersion("corrplot")) != "0.95") {
            stop("Expected corrplot reference version 0.95")
          }
      - name: Check R scene contract consumer
        run: Rscript python/reference/test_r_scene_consumer.R
      - name: Build source package
        working-directory: r
        run: R CMD build corrplotng
      - name: Check source package as CRAN
        working-directory: r
        run: R CMD check --as-cran --no-manual corrplotng_*.tar.gz
