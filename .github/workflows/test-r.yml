name: R package checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: implementations/r
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install pinned legacy corrplot reference
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github("taiyun/corrplot@62532f700e6c9d04b93ffbf0bf56e264b0e0368e", dependencies = FALSE)

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: implementations/r
          error-on: '"warning"'
