name: Rust CRAN dependency audit

on:
  workflow_call:
  # Fast license-policy check for dependency-related changes.
  schedule:
    - cron: "23 5 * * 1"
  # Full audit can also be started manually, e.g. before a CRAN release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cran-dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Fetch the committed Rust workspace dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify committed lockfile is current
        working-directory: rust/bindings/r/rextendr-prototype
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Enforce dependency license policy
        working-directory: rust/bindings/r/rextendr-prototype
        run: cargo deny check licenses


  production-r-license-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Prepare the production R package and its locked vendor sources
        run: Rscript r/corrplotng/tools/prepare-rust-package.R
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify production R Cargo lockfile
        working-directory: r/corrplotng/src/rust
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Enforce production R dependency license policy
        working-directory: r/corrplotng/src/rust
        run: cargo deny check licenses

  production-r-full-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Prepare the production R package and its locked vendor sources
        run: Rscript r/corrplotng/tools/prepare-rust-package.R
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify production R Cargo lockfile
        working-directory: r/corrplotng/src/rust
        run: cargo metadata --locked --format-version 1 > cargo-metadata.json
      - name: Enforce production R dependency license policy
        working-directory: r/corrplotng/src/rust
        run: cargo deny check licenses
      - name: Capture production R dependency tree
        working-directory: r/corrplotng/src/rust
        run: cargo tree --locked --all-features > cargo-tree.txt
      - name: Verify production R offline build from vendored sources
        working-directory: r/corrplotng/src
        run: |
          tar -xf rust/vendor.tar.xz
          mkdir -p .cargo
          cp rust/vendor-config.toml .cargo/config.toml
          CARGO_HOME="$PWD/.cargo" cargo build --locked --offline --release --manifest-path=rust/Cargo.toml --target-dir=rust/target --lib
      - name: Create production R dependency license inventory
        working-directory: r/corrplotng/src/rust
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("cargo-metadata.json").read_text())
          packages = sorted(metadata["packages"], key=lambda p: (p["name"], p["version"]))
          lines = ["name\tversion\tlicense\tlicense_file\tsource"]
          for package in packages:
              lines.append("\t".join([
                  package["name"],
                  package["version"],
                  package.get("license") or "MISSING",
                  package.get("license_file") or "",
                  package.get("source") or "workspace",
              ]))
          Path("dependency-licenses.tsv").write_text("\n".join(lines) + "\n")
          missing = [p for p in packages if not p.get("license") and not p.get("license_file")]
          print(f"Resolved packages: {len(packages)}")
          print(f"Packages without SPDX license or license-file metadata: {len(missing)}")
          for package in missing:
              print(f"  {package['name']} {package['version']}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-r-cargo-dependency-audit
          path: |
            r/corrplotng/src/rust/Cargo.lock
            r/corrplotng/src/rust/cargo-metadata.json
            r/corrplotng/src/rust/cargo-tree.txt
            r/corrplotng/src/rust/dependency-licenses.tsv
            r/corrplotng/src/rust/vendor-config.toml
            r/corrplotng/src/rust/vendor.tar.xz
          if-no-files-found: error
          retention-days: 14

  full-audit:
    # PRs run only the inexpensive license-policy check. Scheduled and
    # manually dispatched runs also perform vendoring and offline validation.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Fetch the committed Rust workspace dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify committed lockfile is current
        working-directory: rust/bindings/r/rextendr-prototype
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Enforce dependency license policy
        working-directory: rust/bindings/r/rextendr-prototype
        run: cargo deny check licenses
      - name: Capture resolved dependency metadata
        working-directory: rust/bindings/r/rextendr-prototype
        run: |
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          cargo tree --locked --all-features > cargo-tree.txt
      - name: Vendor all resolved crate sources
        working-directory: rust/bindings/r/rextendr-prototype
        run: cargo vendor --locked vendor > vendor-config.toml
      - name: Verify offline Cargo build from vendored sources
        working-directory: rust/bindings/r/rextendr-prototype
        run: |
          mkdir -p .cargo
          cp vendor-config.toml .cargo/config.toml
          cargo build --locked --offline
      - name: Create dependency license inventory
        working-directory: rust/bindings/r/rextendr-prototype
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("cargo-metadata.json").read_text())
          packages = sorted(metadata["packages"], key=lambda p: (p["name"], p["version"]))
          lines = ["name\tversion\tlicense\tlicense_file\tsource"]
          for package in packages:
              lines.append("\t".join([
                  package["name"],
                  package["version"],
                  package.get("license") or "MISSING",
                  package.get("license_file") or "",
                  package.get("source") or "workspace",
              ]))
          Path("dependency-licenses.tsv").write_text("\n".join(lines) + "\n")
          missing = [p for p in packages if not p.get("license") and not p.get("license_file")]
          print(f"Resolved packages: {len(packages)}")
          print(f"Packages without SPDX license or license-file metadata: {len(missing)}")
          for package in missing:
              print(f"  {package['name']} {package['version']}")
          PY
      - name: Archive vendored sources
        working-directory: rust/bindings/r/rextendr-prototype
        run: tar -cJf vendor.tar.xz vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-cran-dependency-audit
          path: |
            rust/bindings/r/rextendr-prototype/Cargo.lock
            rust/bindings/r/rextendr-prototype/cargo-metadata.json
            rust/bindings/r/rextendr-prototype/cargo-tree.txt
            rust/bindings/r/rextendr-prototype/dependency-licenses.tsv
            rust/bindings/r/rextendr-prototype/vendor-config.toml
            rust/bindings/r/rextendr-prototype/vendor.tar.xz
          if-no-files-found: error
          retention-days: 14
