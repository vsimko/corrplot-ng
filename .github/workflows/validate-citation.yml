name: Validate citation metadata

on:
  pull_request:
    paths:
      - "CITATION.cff"
      - ".github/workflows/validate-citation.yml"
  push:
    branches:
      - main
    paths:
      - "CITATION.cff"
      - ".github/workflows/validate-citation.yml"

permissions:
  contents: read

concurrency:
  group: validate-citation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CFF validator
        run: python -m pip install "cffconvert==2.0.0"
      - name: Validate citation metadata
        run: cffconvert --validate
