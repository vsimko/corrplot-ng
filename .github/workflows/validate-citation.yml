name: Validate citation metadata

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "CITATION.cff"
      - ".github/workflows/validate-citation.yml"

permissions:
  contents: read

concurrency:
  group: validate-citation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install CFF validator
        run: python -m pip install "cffconvert==2.0.0"
      - name: Validate citation metadata
        run: cffconvert --validate
