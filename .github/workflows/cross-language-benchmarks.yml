name: Performance benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "prototypes/cpp-rcpp/**"
      - "prototypes/rust-rextendr/**"
      - ".github/workflows/cross-language-benchmarks.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      include_stress:
        description: "Include the 500x500 and 1000x1000 stress workloads"
        required: false
        type: boolean
        default: false
      package_smoke:
        description: "Build and test native packages on Ubuntu, macOS and Windows"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-smoke:
    name: Fast benchmark smoke checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test benchmark timing harness
        run: python -m unittest discover -s benchmarks -p 'test_timing_method.py' -v
      - name: Test scene-v1 oracle and invalid-input handling
        run: python -m unittest discover -s benchmarks -p 'test_scene_v1_*.py' -v
      - name: Run a short shared-core smoke benchmark
        run: python benchmarks/run_shared_core.py --iterations 3 --output benchmark-results/smoke-results.json

  shared-core:
    if: github.event_name != 'pull_request'
    name: Benchmark the Python shared-core prototype
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test benchmark timing harness
        run: python -m unittest discover -s benchmarks -p 'test_timing_method.py' -v
      - name: Run regular shared-core workloads
        run: python benchmarks/run_shared_core.py --iterations 20 --output benchmark-results/results.json
      - name: Upload shared-core results
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-benchmark-results
          path: benchmark-results/results.json
          if-no-files-found: error
          retention-days: 90

  shared-core-stress:
    if: github.event_name == 'workflow_dispatch' && inputs.include_stress
    name: Benchmark large shared-core workloads
    needs: shared-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run B03 and B04 stress workloads
        run: python benchmarks/run_shared_core.py --iterations 20 --include-stress --output benchmark-results/stress-results.json
      - name: Upload shared-core stress results
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-stress-benchmark-results
          path: benchmark-results/stress-results.json
          if-no-files-found: error
          retention-days: 90

  cross-language:
    if: github.event_name != 'pull_request'
    name: Compare Python, Pure R, C++/Rcpp and Rust/rextendr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R benchmark dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::jsonlite
            any::rextendr
            any::usethis
      - name: Test Python scene-v1 invalid-input handling
        run: python -m unittest discover -s benchmarks -p 'test_scene_v1_*.py' -v
      - name: Export regular shared fixtures
        run: python benchmarks/export_native_fixtures.py --output benchmark-results/native-fixtures.json
      - name: Benchmark Python reference on regular fixtures
        run: python benchmarks/run_python_scene_v1_reference.py --fixtures benchmark-results/native-fixtures.json --output benchmark-results/python-scene-v1.json
      - name: Generate Rcpp wrappers
        shell: Rscript {0}
        run: Rcpp::compileAttributes("prototypes/cpp-rcpp")
      - name: Install C++/Rcpp candidate
        shell: bash
        run: R CMD INSTALL prototypes/cpp-rcpp
      - name: Generate Rust/rextendr package
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Install Rust/rextendr candidate
        shell: bash
        run: R CMD INSTALL prototypes/rust-rextendr/.ci-r-package
      - name: Benchmark Pure R, C++/Rcpp and Rust/rextendr on regular fixtures
        run: Rscript benchmarks/run_native_scene_v1.R benchmark-results/native-fixtures.json benchmark-results/native-scene-v1.json
      - name: Upload regular cross-language results
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-scene-v1-benchmark-results
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90
      - name: Export B03/B04 stress fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.include_stress
        run: python benchmarks/export_native_fixtures.py --stress-only --output benchmark-results/stress-fixtures.json
      - name: Benchmark Python reference on B03/B04
        if: github.event_name == 'workflow_dispatch' && inputs.include_stress
        run: python benchmarks/run_python_scene_v1_reference.py --fixtures benchmark-results/stress-fixtures.json --output benchmark-results/python-stress-scene-v1.json
      - name: Benchmark C++/Rcpp and Rust/rextendr on B03/B04
        if: github.event_name == 'workflow_dispatch' && inputs.include_stress
        run: Rscript benchmarks/run_native_scene_v1.R benchmark-results/stress-fixtures.json benchmark-results/native-stress-scene-v1.json --stress-mode
      - name: Upload cross-language stress results
        if: github.event_name == 'workflow_dispatch' && inputs.include_stress
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-stress-benchmark-results
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90

  package-smoke:
    name: Build and test native packages (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.package_smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R package build dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::jsonlite
            any::rextendr
            any::usethis
      - name: Export deterministic scene-v1 fixtures
        run: python benchmarks/export_native_fixtures.py --output benchmark-results/native-fixtures.json
      - name: Generate Rcpp wrappers
        shell: Rscript {0}
        run: Rcpp::compileAttributes("prototypes/cpp-rcpp")
      - name: Build and install C++/Rcpp package
        shell: bash
        run: R CMD INSTALL prototypes/cpp-rcpp
      - name: Generate Rust/rextendr R package
        run: Rscript prototypes/rust-rextendr/prepare-r-package.R
      - name: Build and install Rust/rextendr package
        shell: bash
        run: R CMD INSTALL prototypes/rust-rextendr/.ci-r-package
      - name: Verify semantic parity for every implementation
        run: Rscript benchmarks/test_native_scene_v1.R benchmark-results/native-fixtures.json
