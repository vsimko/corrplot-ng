          print(f"{name}: " + "; ".join(f"{backend}={result.get('meanPerCallMs', result.get('perCallMs', float('nan'))):.5f} ms/call (95% CI {result.get('ci95LowerMs', float('nan')):.5f}–{result.get('ci95UpperMs', float('nan')):.5f})" for backend, result, _ in rows))
