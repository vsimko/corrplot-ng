name: WASM from R experiment

on:
  push:
    branches:
      - experiment/wasm-r-runtime
    paths:
      - "experiments/wasm-r/**"
      - "crates/corrplot-core/**"
      - ".github/workflows/test-wasm-r-experiment.yml"
  pull_request:
    paths:
      - "experiments/wasm-r/**"
      - "crates/corrplot-core/**"
      - ".github/workflows/test-wasm-r-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-wasi-module:
    name: Same WASI module in Node and R (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wasmtime_archive: wasmtime-v50.0.1-x86_64-linux-c-api.tar.xz
            wasmtime_sha256: e2c0c26e1aef52f82f0b9918ad6f34cc30f4b557aee3e261cb127a9462be8f4d
          - os: macos-15-intel
            wasmtime_archive: wasmtime-v50.0.1-x86_64-macos-c-api.tar.xz
            wasmtime_sha256: b6d436cba5c0964785c6ff7c9b5a743131555a0227b4f742185c4fb520c502c5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Build shared-core WASI module
        run: |
          CARGO_TARGET_DIR=experiments/wasm-r/wasm-host/target cargo build \
            --manifest-path experiments/wasm-r/wasm-host/Cargo.toml \
            --target wasm32-wasip1 \
            --release

      - name: Build host-neutral embedded ABI module
        run: |
          CARGO_TARGET_DIR=experiments/wasm-r/wasm-abi/target cargo build \
            --manifest-path experiments/wasm-r/wasm-abi/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Locate WASM artifacts
        run: |
          WASM_MODULE="$(find "$GITHUB_WORKSPACE/experiments/wasm-r/wasm-host/target/wasm32-wasip1/release" -maxdepth 1 -type f -name "*.wasm" -print -quit)"
          EMBEDDED_WASM_MODULE="$(find "$GITHUB_WORKSPACE/experiments/wasm-r/wasm-abi/target/wasm32-unknown-unknown/release" -maxdepth 1 -type f -name "*.wasm" -print -quit)"
          if [[ -z "$WASM_MODULE" || -z "$EMBEDDED_WASM_MODULE" ]]; then
            echo "WASM artifacts not found; available files:"
            find experiments/wasm-r/wasm-host/target experiments/wasm-r/wasm-abi/target -type f -name "*.wasm" -print
            exit 1
          fi
          echo "WASI module: $WASM_MODULE"
          echo "Embedded ABI module: $EMBEDDED_WASM_MODULE"
          echo "WASM_MODULE=$WASM_MODULE" >> "$GITHUB_ENV"
          echo "EMBEDDED_WASM_MODULE=$EMBEDDED_WASM_MODULE" >> "$GITHUB_ENV"

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Install pinned Wasmtime C API
        run: |
          set -euo pipefail
          VERSION=50.0.1
          ARCHIVE="${{ matrix.wasmtime_archive }}"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL "$URL" -o "/tmp/$ARCHIVE"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${{ matrix.wasmtime_sha256 }}  /tmp/$ARCHIVE" | sha256sum -c -
          else
            echo "${{ matrix.wasmtime_sha256 }}  /tmp/$ARCHIVE" | shasum -a 256 -c -
          fi
          mkdir -p /tmp/wasmtime-c-api
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "/tmp/$ARCHIVE" -d /tmp/wasmtime-c-api
            ROOT="$(find /tmp/wasmtime-c-api -mindepth 1 -maxdepth 1 -type d -print -quit)"
            if [[ -n "$ROOT" ]]; then
              mv "$ROOT"/* /tmp/wasmtime-c-api/
              rmdir "$ROOT"
            fi
          else
            tar -xJf "/tmp/$ARCHIVE" --strip-components=1 -C /tmp/wasmtime-c-api
          fi
          echo "WASMTIME_C_API_ROOT=/tmp/wasmtime-c-api" >> "$GITHUB_ENV"

      - name: Install R experiment dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "digest", "V8"), repos = "https://cloud.r-project.org")'

      - name: Build native Rust R binding
        shell: bash
        run: |
          set -euo pipefail
          R_HOME="$(R RHOME)" cargo build \
            --manifest-path experiments/wasm-r/native-r/Cargo.toml \
            --release
          NATIVE_LIBRARY="$(find experiments/wasm-r/native-r/target/release -maxdepth 1 -type f \\( -name 'libcorrplot_r_native.so' -o -name 'libcorrplot_r_native.dylib' -o -name 'corrplot_r_native.dll' \\) -print -quit)"
          if [[ -z "$NATIVE_LIBRARY" ]]; then
            echo "Native Rust R library not found"
            find experiments/wasm-r/native-r/target/release -maxdepth 1 -type f -print
            exit 1
          fi
          echo "NATIVE_LIBRARY=$NATIVE_LIBRARY" >> "$GITHUB_ENV"

      - name: Run identical module and fixtures in Node and R
        shell: bash
        run: |
          set -euo pipefail
          WASM="$WASM_MODULE"
          for FIXTURE in experiments/wasm-r/fixtures/*.json; do
            NAME="$(basename "$FIXTURE" .json)"
            node experiments/wasm-r/node/run.mjs "$WASM" "$FIXTURE" > "/tmp/node-$NAME.json"
            Rscript experiments/wasm-r/r/run.R "$WASM" "$FIXTURE" > "/tmp/r-$NAME.json"
            node experiments/wasm-r/node/run-embedded.mjs "$EMBEDDED_WASM_MODULE" "$FIXTURE" > "/tmp/node-embedded-$NAME.json"
            WASMTIME_C_API_ROOT="$WASMTIME_C_API_ROOT" Rscript experiments/wasm-r/r/run-embedded.R "$EMBEDDED_WASM_MODULE" "$FIXTURE" "/tmp/r-embedded-$NAME.json"
            Rscript experiments/wasm-r/r/run-v8.R "$EMBEDDED_WASM_MODULE" "$FIXTURE" "/tmp/r-v8-$NAME.json"
            Rscript experiments/wasm-r/r/run-native-rust.R "$NATIVE_LIBRARY" "$FIXTURE" "/tmp/r-native-rust-$NAME.json"
            test -s "/tmp/r-embedded-$NAME.json"
            Rscript experiments/wasm-r/r/benchmark-native.R "$FIXTURE" "/tmp/r-native-reference-$NAME.json"
            python3 - "$NAME" "/tmp/node-$NAME.json" "/tmp/r-$NAME.json" "/tmp/node-embedded-$NAME.json" "/tmp/r-embedded-$NAME.json" "/tmp/r-v8-$NAME.json" "/tmp/r-native-rust-$NAME.json" "/tmp/r-native-reference-$NAME.json" <<'PY'
          import json, sys
          name, node_path, r_path, node_embedded_path, r_embedded_path, r_v8_path, r_native_rust_path, r_native_reference_path = sys.argv[1:]
          with open(node_path, encoding="utf-8") as f:
              node = json.load(f)
          with open(r_path, encoding="utf-8") as f:
              r = json.load(f)
          with open(node_embedded_path, encoding="utf-8") as f:
              node_embedded = json.load(f)
          with open(r_embedded_path, encoding="utf-8") as f:
              r_embedded = json.load(f)
          with open(r_v8_path, encoding="utf-8") as f:
              r_v8 = json.load(f)
          with open(r_native_rust_path, encoding="utf-8") as f:
              r_native_rust = json.load(f)
          with open(r_native_reference_path, encoding="utf-8") as f:
              r_native_reference = json.load(f)
          assert node["wasmSha256"] == r["wasmSha256"], (name, node["wasmSha256"], r["wasmSha256"])
          assert node["fixtureSha256"] == r["fixtureSha256"], (name, node["fixtureSha256"], r["fixtureSha256"])
          assert node["response"] == r["response"], (name, node["response"], r["response"])
          assert node_embedded["wasmSha256"] == r_embedded["wasmSha256"], (name, node_embedded, r_embedded)
          assert node_embedded["fixtureSha256"] == r_embedded["fixtureSha256"], (name, node_embedded, r_embedded)
          assert node_embedded["response"] == r_embedded["response"], (name, node_embedded["response"], r_embedded["response"])
          assert node_embedded["response"] == node["response"], (name, node_embedded["response"], node["response"])
          assert r_v8["response"] == r_embedded["response"], (name, r_v8["response"], r_embedded["response"])
          assert r_native_rust["response"] == r_embedded["response"], (name, r_native_rust["response"], r_embedded["response"])
          assert r_native_reference["response"] == r_embedded["response"], (name, r_native_reference["response"], r_embedded["response"])
          print(f"{name}: parity passed; V8 {r_v8['perCallMs']:.4f} ms/call, Wasmtime {r_embedded['perCallMs']:.4f} ms/call, native Rust {r_native_rust['perCallMs']:.4f} ms/call, native R reference {r_native_reference['perCallMs']:.4f} ms/call")
          PY
          done
