name: Regenerate npm lockfile for Vite workspace fix

on:
  push:
    branches:
      - fix/dependabot-vite-root-peer
    paths:
      - "npm/package.json"
      - "npm/packages/react/package.json"
      - "npm/packages/vue/package.json"
      - ".github/workflows/regenerate-npm-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Use the same npm version as the Dependabot updater
        run: |
          npm install --global npm@12.2.2 --no-audit --no-fund
          npm --version
      - name: Regenerate the workspace lockfile
        working-directory: npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean reproducible installation
        working-directory: npm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls vite --all
          node --input-type=commonjs <<'NODE'
          const lock = require("./package-lock.json");
          const root = lock.packages[""];
          if (root.devDependencies?.vite !== "8.3.6") {
            throw new Error("Root package-lock does not declare Vite 8.3.6");
          }
          if (lock.packages["node_modules/vite"]?.version !== "8.3.6") {
            throw new Error("Root Vite lock entry is not 8.3.6");
          }
          for (const name of ["packages/react", "packages/vue"]) {
            if (lock.packages[name]?.devDependencies?.vite) {
              throw new Error(`${name} still declares a local Vite dependency`);
            }
          }
          for (const path of Object.keys(lock.packages)) {
            if (/^packages\/(react|vue)\/node_modules\/vite$/.test(path)) {
              throw new Error(`Unexpected nested Vite entry: ${path}`);
            }
          }
          console.log("Root Vite lockfile structure verified.");
          NODE
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the workspace manifests."
            exit 0
          fi
          git commit -m "chore(npm): regenerate lockfile for root Vite dependency"
          git push
