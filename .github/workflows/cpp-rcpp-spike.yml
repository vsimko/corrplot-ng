name: C++ / Rcpp spike

on:
  push:
    branches:
      - prototype/cpp-rcpp-spike
  pull_request:
    paths:
      - "prototypes/cpp-rcpp/**"
      - ".github/workflows/cpp-rcpp-spike.yml"
  workflow_dispatch:

jobs:
  rcpp-smoke-test:
    name: Rcpp smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Rcpp
        shell: Rscript {0}
        run: install.packages("Rcpp", repos = "https://cloud.r-project.org")

      - name: Generate Rcpp wrappers
        shell: Rscript {0}
        run: Rcpp::compileAttributes("prototypes/cpp-rcpp")

      - name: Install spike package
        shell: bash
        run: R CMD INSTALL prototypes/cpp-rcpp

      - name: Run integration smoke test
        shell: bash
        run: Rscript prototypes/cpp-rcpp/tests/smoke-test.R
