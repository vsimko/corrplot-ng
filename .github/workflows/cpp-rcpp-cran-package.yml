name: C++ Rcpp CRAN source-package check

on:
  pull_request:
    paths:
      - "prototypes/cpp-rcpp/**"
      - ".github/workflows/cpp-rcpp-cran-package.yml"
  push:
    branches:
      - issue-111-cran-policy-comparison
    paths:
      - "prototypes/cpp-rcpp/**"
      - ".github/workflows/cpp-rcpp-cran-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package-check:
    name: R CMD check --as-cran (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R package check dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::testthat
      - name: Generate Rcpp wrappers
        shell: Rscript {0}
        run: Rcpp::compileAttributes("prototypes/cpp-rcpp")
      - name: Build source package
        shell: bash
        run: |
          set -euxo pipefail
          R CMD build --no-build-vignettes --no-manual prototypes/cpp-rcpp
          tarball=corrplotngcppspike_0.0.0.9000.tar.gz
          test -s "$tarball"
          echo "R source tarball size: $(wc -c < "$tarball") bytes"
      - name: Check source package
        shell: bash
        env:
          _R_CHECK_CRAN_INCOMING_: "false"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
        run: |
          set -euxo pipefail
          R CMD check --as-cran --no-manual corrplotngcppspike_0.0.0.9000.tar.gz
