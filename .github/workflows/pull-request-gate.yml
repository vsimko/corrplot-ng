name: Pull request gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected test suites
    runs-on: ubuntu-latest
    outputs:
      npm_workspace: ${{ steps.filter.outputs.npm_workspace }}
      shared_rust_core: ${{ steps.filter.outputs.shared_rust_core }}
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      node_native: ${{ steps.filter.outputs.node_native }}
      node_wasm_parity: ${{ steps.filter.outputs.node_wasm_parity }}
      wasm_binding: ${{ steps.filter.outputs.wasm_binding }}
      wasm_r_experiment: ${{ steps.filter.outputs.wasm_r_experiment }}
      rust_cran_audit: ${{ steps.filter.outputs.rust_cran_audit }}
      rust_windows_binary: ${{ steps.filter.outputs.rust_windows_binary }}
      workflow_lint: ${{ steps.filter.outputs.workflow_lint }}
      citation: ${{ steps.filter.outputs.citation }}
      rextendr_offline: ${{ steps.filter.outputs.rextendr_offline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            npm_workspace:
              - "contracts/**"
              - "fixtures/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "npm/package.json"
              - "npm/package-lock.json"
              - "npm/packages/native-node-*/**"
              - "npm/tests/cross-backend/**"
              - "npm/.changeset/**"
              - "npm/packages/**"
              - "rust/bindings/node/**"
              - "rust/bindings/wasm/**"
              - ".github/workflows/test-npm-workspace.yml"
            shared_rust_core:
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "rust/tools/corrplot-cli/**"
              - "rust/bindings/r/rextendr-prototype/**"
              - "rust/bindings/node/**"
              - "rust/bindings/wasm/**"
              - ".github/workflows/test-shared-rust-core.yml"
            rust_cli:
              - "rust/tools/corrplot-cli/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "python/reference/prototypes/publication-config-v1/**"
              - "tools/repository/validate_svg.py"
              - "docs/cli-installation.md"
              - "fixtures/**"
              - ".github/workflows/test-rust-cli.yml"
            node_native:
              - "npm/packages/native-node/**"
              - "npm/packages/native-node-*/**"
              - "rust/bindings/node/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - ".github/workflows/test-node-native.yml"
            node_wasm_parity:
              - "contracts/**"
              - "fixtures/**"
              - "npm/packages/native-node/**"
              - "npm/packages/native-node-*/**"
              - "npm/tests/cross-backend/**"
              - "npm/packages/wasm/**"
              - "rust/bindings/node/**"
              - "rust/bindings/wasm/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - "python/reference/scene-v1-construction.example.json"
              - ".github/workflows/test-node-wasm-parity.yml"
            wasm_binding:
              - "contracts/**"
              - "fixtures/**"
              - "npm/packages/wasm/**"
              - "rust/bindings/wasm/**"
              - "npm/packages/typescript/**"
              - "npm/packages/react/**"
              - "npm/packages/vue/**"
              - "npm/package.json"
              - "npm/package-lock.json"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "fixtures/scene-v1/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - ".github/workflows/test-wasm-binding.yml"
            wasm_r_experiment:
              - "experiments/wasm-r/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - ".github/workflows/test-wasm-r-experiment.yml"
            rust_cran_audit:
              - "rust/Cargo.toml"
              - "rust/bindings/r/rextendr-prototype/Cargo.toml"
              - "rust/bindings/r/rextendr-prototype/Cargo.lock"
              - "rust/Cargo.lock"
              - "rust/bindings/r/rextendr-prototype/deny.toml"
              - "rust/bindings/r/rextendr-prototype/src/**"
              - "rust/crates/corrplot-core/**"
              - "r/corrplotng/DESCRIPTION"
              - "r/corrplotng/tools/prepare-rust-package.R"
              - "r/corrplotng/src/rust/**"
              - ".github/workflows/rust-cran-dependency-audit.yml"
            rust_windows_binary:
              - "rust/bindings/r/rextendr-prototype/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - ".github/workflows/test-rust-windows-binary.yml"
              - "docs/cran-rust-dependency-audit-results.md"
            workflow_lint:
              - ".github/workflows/**"
            citation:
              - "CITATION.cff"
              - ".github/workflows/validate-citation.yml"
            rextendr_offline:
              - "rust/bindings/r/rextendr-prototype/**"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/corrplot-core/**"
              - "!rust/crates/corrplot-core/src/scene_tests.rs"
              - ".github/workflows/rust-rextendr-offline-package.yml"

  foundation:
    name: Foundation checks
    uses: ./.github/workflows/test-foundation.yml

  r_package:
    name: R package checks
    uses: ./.github/workflows/test-r.yml

  npm_workspace:
    name: npm workspace checks
    needs: changes
    if: needs.changes.outputs.npm_workspace == 'true'
    uses: ./.github/workflows/test-npm-workspace.yml

  shared_rust_core:
    name: Shared Rust core checks
    needs: changes
    if: needs.changes.outputs.shared_rust_core == 'true'
    uses: ./.github/workflows/test-shared-rust-core.yml

  rust_cli:
    name: Rust CLI checks
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true'
    uses: ./.github/workflows/test-rust-cli.yml

  node_native:
    name: Native Node checks
    needs: changes
    if: needs.changes.outputs.node_native == 'true'
    uses: ./.github/workflows/test-node-native.yml

  node_wasm_parity:
    name: Node and WASM parity checks
    needs: changes
    if: needs.changes.outputs.node_wasm_parity == 'true'
    uses: ./.github/workflows/test-node-wasm-parity.yml

  wasm_binding:
    name: Browser WASM checks
    needs: changes
    if: needs.changes.outputs.wasm_binding == 'true'
    uses: ./.github/workflows/test-wasm-binding.yml

  wasm_r_experiment:
    name: WASM from R experiment checks
    needs: changes
    if: needs.changes.outputs.wasm_r_experiment == 'true'
    uses: ./.github/workflows/test-wasm-r-experiment.yml

  rust_cran_audit:
    name: Rust CRAN dependency checks
    needs: changes
    if: needs.changes.outputs.rust_cran_audit == 'true'
    uses: ./.github/workflows/rust-cran-dependency-audit.yml

  rust_windows_binary:
    name: Rust Windows binary checks
    needs: changes
    if: needs.changes.outputs.rust_windows_binary == 'true'
    uses: ./.github/workflows/test-rust-windows-binary.yml

  workflow_lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflow_lint == 'true'
    uses: ./.github/workflows/test-workflows.yml

  citation:
    name: Citation metadata
    needs: changes
    if: needs.changes.outputs.citation == 'true'
    uses: ./.github/workflows/validate-citation.yml

  rextendr_offline:
    name: rextendr offline package checks
    needs: changes
    if: needs.changes.outputs.rextendr_offline == 'true'
    uses: ./.github/workflows/rust-rextendr-offline-package.yml

  pr-gate:
    name: PR gate
    if: always()
    needs:
      - changes
      - foundation
      - r_package
      - npm_workspace
      - shared_rust_core
      - rust_cli
      - node_native
      - node_wasm_parity
      - wasm_binding
      - wasm_r_experiment
      - rust_cran_audit
      - rust_windows_binary
      - workflow_lint
      - citation
      - rextendr_offline
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required workflow failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one PR test workflow failed or was cancelled."
          exit 1

      - name: Report successful aggregate result
        if: "!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
        run: echo "All applicable PR workflows succeeded; intentionally skipped workflows are accepted."
