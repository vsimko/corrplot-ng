version: 2

updates:
  # Keep third-party GitHub Actions references current. Non-breaking updates
  # are grouped; major updates and security updates remain individually visible.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # This action uses Rust toolchain release tags, not semver action releases.
    # Dependabot misreads those tags (e.g. 1.78.0 -> 1.120.0), so manage it manually.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # One Cargo workspace owns the core, CLI and all production-facing bindings.
  # The WASM-R experiment remains a separate set of independent Cargo projects.
  - package-ecosystem: cargo
    directories:
      - /rust
      - /experiments/wasm-r/native-r
      - /experiments/wasm-r/wasm-abi
      - /experiments/wasm-r/wasm-host
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      cargo-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name

  # The excluded disposable R/rextendr prototype keeps a separate audited lockfile.
  - package-ecosystem: cargo
    directory: /rust/bindings/r/rextendr-prototype
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 0

  # The npm/ directory is the private workspace root.
  # Platform-specific native packages are unpublished build artifacts.
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      - dependency-name: "@corrplot-ng/native-node-linux-x64-gnu"
      - dependency-name: "@corrplot-ng/native-node-darwin-x64"
      - dependency-name: "@corrplot-ng/native-node-darwin-arm64"
      - dependency-name: "@corrplot-ng/native-node-win32-x64-msvc"
    groups:
      npm-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # jsonschema is the only Python package dependency currently declared.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      python-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
